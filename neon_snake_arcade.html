<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent swipe-to-refresh on mobile */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .neon-text-green {
            text-shadow: 0 0 5px #39ff14, 0 0 15px #39ff14, 0 0 30px #39ff14;
        }
        .neon-text-pink {
            text-shadow: 0 0 5px #ff00ff, 0 0 15px #ff00ff, 0 0 30px #ff00ff;
        }
        .neon-border-green {
            box-shadow: 0 0 10px #39ff14, inset 0 0 10px #39ff14;
            border-color: #39ff14;
        }
        .neon-border-pink {
            box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
            border-color: #ff00ff;
        }
    </style>
</head>
<body class="text-white">

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="uiLayer" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10 transition-opacity duration-300">
        
        <!-- Main Menu -->
        <div id="menuScreen" class="flex flex-col items-center pointer-events-auto bg-black/80 p-8 border-2 neon-border-green rounded-2xl backdrop-blur-sm max-w-sm mx-4">
            <h1 class="text-5xl font-black text-green-400 mb-2 tracking-widest neon-text-green text-center uppercase">NEON<br>SNAKE</h1>
            <p class="text-gray-300 text-sm mb-8 text-center leading-relaxed">
                <span class="text-green-300 font-bold">Desktop:</span> Arrows / WASD to move.<br>
                <span class="text-green-300 font-bold">Mobile:</span> Swipe to steer.<br><br>
                Eat the <span class="text-pink-400 font-bold neon-text-pink">Pink Nodes</span> to grow. Avoid the walls and yourself!
            </p>
            <button id="startBtn" class="px-8 py-3 bg-transparent border-2 border-green-400 text-green-400 font-bold text-xl rounded hover:bg-green-400 hover:text-black transition-all uppercase tracking-wider shadow-[0_0_15px_#39ff14] hover:shadow-[0_0_30px_#39ff14]">
                Play Now
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden flex-col items-center pointer-events-auto bg-black/80 p-8 border-2 neon-border-pink rounded-2xl backdrop-blur-sm max-w-sm mx-4">
            <h1 class="text-5xl font-black text-pink-500 mb-4 tracking-widest neon-text-pink text-center uppercase">CRASHED</h1>
            <p id="finalScore" class="text-white text-3xl mb-2 font-mono font-bold drop-shadow-md">Score: 0</p>
            <p id="bestScore" class="text-green-400 text-lg mb-8 font-mono">High Score: 0</p>
            <button id="restartBtn" class="px-8 py-3 bg-transparent border-2 border-pink-500 text-pink-500 font-bold text-xl rounded hover:bg-pink-500 hover:text-black transition-all uppercase tracking-wider shadow-[0_0_15px_#ff00ff] hover:shadow-[0_0_30px_#ff00ff]">
                Play Again
            </button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full p-6 flex justify-between pointer-events-none z-0">
        <div class="text-2xl font-mono font-bold text-white drop-shadow-[0_0_8px_#fff]" id="scoreDisplay">0</div>
        <div class="text-xl font-mono font-bold text-green-400 drop-shadow-[0_0_8px_#39ff14]" id="highScoreDisplay">HI: 0</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const menuScreen = document.getElementById('menuScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const bestScore = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game Configuration
        const TILE_SIZE = 25;
        const INITIAL_SPEED = 150; // ms per move
        const MIN_SPEED = 50;
        const SPEED_DECREMENT = 2; // speed decreases by 2ms every food eaten

        // Game State
        let state = 'menu'; // 'menu', 'playing', 'gameover'
        let cols, rows;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('neonSnakeHighScore') || 0;
        let speed = INITIAL_SPEED;
        
        let lastMoveTime = 0;
        let animationId;

        // Resize Canvas and Calculate Grid
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Calculate grid dimensions based on window size
            cols = Math.floor(canvas.width / TILE_SIZE);
            rows = Math.floor(canvas.height / TILE_SIZE);
            
            if (state === 'menu') {
                drawMenuBackground();
            } else if (state === 'playing') {
                draw();
            }
        }
        window.addEventListener('resize', resize);

        // Input Handling - Keyboard
        window.addEventListener('keydown', (e) => {
            if (state !== 'playing') {
                // Allow starting game with Space or Enter
                if ((e.code === 'Space' || e.code === 'Enter') && state !== 'playing') {
                    startGame();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Input Handling - Swipe
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            if (state !== 'playing') return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (state === 'playing') e.preventDefault(); // Prevent scrolling while playing
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (state !== 'playing') return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, { passive: false });

        function handleSwipe(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            
            // Require a minimum swipe distance to avoid accidental taps
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 0 && direction.x !== -1) {
                    nextDirection = { x: 1, y: 0 }; // Right
                } else if (dx < 0 && direction.x !== 1) {
                    nextDirection = { x: -1, y: 0 }; // Left
                }
            } else {
                // Vertical swipe
                if (dy > 0 && direction.y !== -1) {
                    nextDirection = { x: 0, y: 1 }; // Down
                } else if (dy < 0 && direction.y !== 1) {
                    nextDirection = { x: 0, y: -1 }; // Up
                }
            }
        }

        // Button Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Core Functions
        function initGame() {
            // Start snake in the middle
            const startX = Math.floor(cols / 2);
            const startY = Math.floor(rows / 2);
            
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = INITIAL_SPEED;
            
            highScoreDisplay.innerText = `HI: ${highScore}`;
            updateScoreDisplay();
            spawnFood();
        }

        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
                
                // Make sure food doesn't spawn on the snake
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = score;
        }

        function startGame() {
            state = 'playing';
            menuScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            
            initGame();
            lastMoveTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'gameover';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonSnakeHighScore', highScore);
            }
            
            finalScore.innerText = `Score: ${score}`;
            bestScore.innerText = `High Score: ${highScore}`;
        }

        function update() {
            // Update direction
            direction = { ...nextDirection };
            
            // Calculate new head position
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // Check Wall Collision (Death)
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                gameOver();
                return;
            }
            
            // Check Self Collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScoreDisplay();
                speed = Math.max(MIN_SPEED, speed - SPEED_DECREMENT);
                spawnFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#11111a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            // Draw logical grid centered if canvas is not perfectly divisible
            const xOffset = (canvas.width - cols * TILE_SIZE) / 2;
            const yOffset = (canvas.height - rows * TILE_SIZE) / 2;
            
            // Set transform to center the grid
            ctx.setTransform(1, 0, 0, 1, xOffset, yOffset);
            
            for (let x = 0; x <= cols; x++) {
                ctx.moveTo(x * TILE_SIZE, 0);
                ctx.lineTo(x * TILE_SIZE, rows * TILE_SIZE);
            }
            for (let y = 0; y <= rows; y++) {
                ctx.moveTo(0, y * TILE_SIZE);
                ctx.lineTo(cols * TILE_SIZE, y * TILE_SIZE);
            }
            ctx.stroke();
        }

        function drawMenuBackground() {
            // Clear
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            
            // Draw a decorative snake in the background
            ctx.fillStyle = '#39ff14';
            ctx.shadowColor = '#39ff14';
            ctx.shadowBlur = 15;
            
            const dummySnake = [
                {x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}, {x: 3, y: 4}, {x: 3, y: 3}
            ];
            
            dummySnake.forEach((seg, i) => {
                if (i === 0) ctx.fillStyle = '#fff';
                else ctx.fillStyle = '#39ff14';
                
                ctx.fillRect(seg.x * TILE_SIZE + 2, seg.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            });
            
            ctx.shadowBlur = 0;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
        }

        function draw() {
            // Clear Screen
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            
            // Draw Food (Neon Pink)
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff00ff';
            
            // Make food pulse slightly based on time
            const pulse = (Math.sin(performance.now() / 150) + 1) / 2; // 0 to 1
            const foodMargin = 3 + (pulse * 2);
            
            ctx.beginPath();
            ctx.roundRect(
                food.x * TILE_SIZE + foodMargin, 
                food.y * TILE_SIZE + foodMargin, 
                TILE_SIZE - (foodMargin * 2), 
                TILE_SIZE - (foodMargin * 2), 
                4
            );
            ctx.fill();
            
            // Draw Snake (Neon Green)
            ctx.shadowColor = '#39ff14';
            ctx.shadowBlur = 15;
            
            snake.forEach((segment, index) => {
                // Head is white/brighter green, body is neon green
                if (index === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 25;
                } else {
                    // Slight gradient/fade toward the tail
                    const alpha = Math.max(0.3, 1 - (index / snake.length) * 0.7);
                    ctx.fillStyle = `rgba(57, 255, 20, ${alpha})`;
                    ctx.shadowBlur = 10;
                }
                
                // Draw rounded rectangles for the snake segments
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * TILE_SIZE + 1, 
                    segment.y * TILE_SIZE + 1, 
                    TILE_SIZE - 2, 
                    TILE_SIZE - 2, 
                    6 // border radius
                );
                ctx.fill();
            });
            
            // Reset shadows for next frame
            ctx.shadowBlur = 0;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
        }

        function gameLoop(timestamp) {
            if (state !== 'playing') return;

            // Calculate elapsed time since last move
            const elapsed = timestamp - lastMoveTime;

            if (elapsed > speed) {
                update();
                lastMoveTime = timestamp;
            }
            
            // We draw every frame for smooth food pulsing and responsiveness, 
            // even if logic only updates based on 'speed'
            draw();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Initialize display
        resize();
        highScoreDisplay.innerText = `HI: ${highScore}`;
    </script>
</body>
</html>
